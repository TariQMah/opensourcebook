<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'">
<title>Open Sourcebook</title>
<style>
  :root { color-scheme: light dark; --bg: #faf8f4; --fg: #1d1b18; --muted: #6b665e; --line: #e4dfd6; --accent: #1d1b18; --accent-fg: #faf8f4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171614; --fg: #f1ede6; --muted: #a39d93; --line: #2e2b27; --accent: #f1ede6; --accent-fg: #171614; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; -webkit-app-region: drag; }
  main { width: min(30rem, calc(100% - 3rem)); text-align: center; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 1rem; }
  #line { color: var(--muted); min-height: 3em; margin: 0; overflow-wrap: anywhere; }
  .dots::after { content: ""; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  #detail { color: var(--muted); font-size: 13px; text-align: left; background: color-mix(in srgb, var(--line) 50%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: .75rem; max-height: 12rem; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-app-region: no-drag; user-select: text; }
  .buttons { display: flex; gap: .5rem; justify-content: center; margin-top: 1.25rem; }
  button { font: inherit; padding: .45rem 1rem; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; -webkit-app-region: no-drag; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Starting Open Sourcebook</h1>
  <p id="line" class="dots">Getting ready</p>
  <p id="first" hidden>The first start sets everything up once and takes a few minutes. Later starts take seconds.</p>
  <div id="failed" hidden>
    <div id="detail"></div>
    <div class="buttons">
      <button id="retry" class="primary" type="button">Try again</button>
      <button id="log" type="button">Show log</button>
    </div>
  </div>
</main>
<script src="page.js"></script>
</body>
</html>
